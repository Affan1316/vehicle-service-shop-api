services:
  db:
    image: postgres:15-alpine
    container_name: auto_shop_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: vehicle_service_shop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: auto_shop_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/vehicle_service_shop"
      SECRET_KEY: "${SECRET_KEY:-default_insecure_development_secret_key_change_me_in_prod}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DEBUG: "false"
      # Shop Identity
      SHOP_NAME: "${SHOP_NAME:-Auto Service Shop}"
      SHOP_ADDRESS: "${SHOP_ADDRESS:-123 Main Street, City, ST 12345}"
      SHOP_PHONE: "${SHOP_PHONE:-(555) 555-0100}"
      # Tax
      TAX_RATE: "${TAX_RATE:-0.07}"
      TAX_LABEL: "${TAX_LABEL:-Sales Tax}"
      # Email
      EMAIL_ENABLED: "${EMAIL_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-localhost}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      # File Uploads
      UPLOAD_DIR: "uploads"
      # Default Seed Admin
      SEED_ADMIN_USERNAME: "${SEED_ADMIN_USERNAME:-admin}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-ChangeMe123!}"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python -m alembic upgrade head &&
        python seed_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: auto_shop_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  pgdata:
  promdata:
  uploads_data:
